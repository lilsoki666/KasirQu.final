name: Build KasirQU APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build KasirQU Android APK
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install setuptools wheel
          python -m pip install buildozer==1.5.0
          python -m pip install cython==0.29.36

      - name: Verify project files
        run: |
          echo "======================================"
          echo "KASIRQU PROJECT CHECK"
          echo "======================================"

          test -f main.py
          test -f buildozer.spec
          test -f requirements.txt

          test -f assets/icon.png
          test -f assets/presplash.png

          echo "main.py        : OK"
          echo "buildozer.spec : OK"
          echo "requirements   : OK"
          echo "icon.png       : OK"
          echo "presplash.png  : OK"

      - name: Check Python syntax
        run: |
          python -m py_compile main.py
          echo "Python syntax check: PASSED"

      - name: Check Buildozer configuration
        run: |
          echo "======================================"
          echo "BUILDOZER CONFIGURATION"
          echo "======================================"

          grep -E \
            '^(title|package.name|package.domain|version|orientation|icon.filename|presplash.filename|requirements|android.api|android.minapi|android.ndk|android.ndk_api|android.archs|android.accept_sdk_license)' \
            buildozer.spec

      - name: Clean previous build
        run: |
          rm -rf .buildozer
          rm -rf bin

          mkdir -p bin

          echo "Build directories cleaned."

      - name: Build APK
        env:
          BUILDOZER_WARN_ON_ROOT: "0"
        run: |
          echo "======================================"
          echo "BUILDING KASIRQU APK"
          echo "======================================"

          buildozer -v android debug

      - name: Verify APK
        run: |
          echo "======================================"
          echo "VERIFYING APK"
          echo "======================================"

          APK="$(find bin -type f -name '*.apk' | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            echo ""
            echo "Contents of bin:"
            ls -lah bin || true
            exit 1
          fi

          echo "APK FOUND:"
          echo "$APK"

          cp "$APK" bin/KasirQU-debug.apk

          echo ""
          echo "Final APK:"
          ls -lh bin/KasirQU-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KasirQU-APK
          path: bin/KasirQU-debug.apk
          if-no-files-found: error
