name: Build KasirQU APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer==1.5.0
          python -m pip install cython==0.29.36

      - name: Check project files
        run: |
          echo "======================================"
          echo "CHECK PROJECT"
          echo "======================================"

          pwd
          ls -la

          test -f main.py
          test -f buildozer.spec
          test -f requirements.txt

          echo "All required files found."

      - name: Check Python syntax
        run: |
          python -m py_compile main.py
          echo "main.py syntax OK"

      - name: Check assets
        run: |
          if [ -d "assets" ]; then
            echo "Assets directory found."
            ls -lah assets
          else
            echo "WARNING: assets directory not found."
          fi

      - name: Clean previous Buildozer files
        run: |
          rm -rf .buildozer
          rm -rf bin

          echo "Buildozer cache cleaned."

      - name: Build APK
        env:
          BUILDOZER_WARN_ON_ROOT: "0"
        run: |
          echo "======================================"
          echo "BUILDING KASIRQU"
          echo "======================================"

          buildozer -v android debug

      - name: Find generated APK
        run: |
          echo "======================================"
          echo "SEARCHING APK"
          echo "======================================"

          find . -type f -name "*.apk" -print

          APK=$(find . -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK FOUND:"
          echo "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KasirQU-APK
          path: |
            bin/*.apk
          if-no-files-found: error
