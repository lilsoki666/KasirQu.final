name: Build KasirQU APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build KasirQU Android APK
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer==1.5.0
          python -m pip install cython==0.29.36

      - name: Verify project
        run: |
          echo "======================================"
          echo "KASIRQU PROJECT CHECK"
          echo "======================================"

          test -f main.py
          test -f buildozer.spec
          test -f requirements.txt

          echo "main.py       : OK"
          echo "buildozer.spec: OK"
          echo "requirements  : OK"

          echo ""
          echo "Assets:"

          test -f assets/icon.png
          test -f assets/presplash.png

          echo "icon.png      : OK"
          echo "presplash.png : OK"

      - name: Check Python syntax
        run: |
          python -m py_compile main.py
          echo "main.py syntax OK"

      - name: Show build configuration
        run: |
          echo "======================================"
          echo "BUILDOZER SPEC"
          echo "======================================"

          cat buildozer.spec

          echo ""
          echo "======================================"
          echo "REQUIREMENTS"
          echo "======================================"

          cat requirements.txt

      - name: Clean Buildozer
        run: |
          rm -rf .buildozer
          rm -rf bin

          mkdir -p bin

          echo "Build directory cleaned."

      - name: Build APK
        env:
          BUILDOZER_WARN_ON_ROOT: "0"
        run: |
          echo "======================================"
          echo "BUILDING KASIRQU"
          echo "======================================"

          buildozer -v android debug

      - name: Locate APK
        run: |
          echo "======================================"
          echo "SEARCHING APK"
          echo "======================================"

          find . -type f -name "*.apk" -print

          APK="$(find . -type f -name '*.apk' | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo ""
          echo "APK FOUND:"
          echo "$APK"

          cp "$APK" bin/KasirQU-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KasirQU-APK
          path: bin/KasirQU-debug.apk
          if-no-files-found: error
