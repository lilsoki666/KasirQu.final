name: Build KasirQU Android APK

on:

  workflow_dispatch:

  push:
    branches:
      - main


permissions:
  contents: read


jobs:

  build:

    name: Build KasirQU APK

    runs-on: ubuntu-22.04


    steps:

      # =========================================
      # CHECKOUT
      # =========================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # =========================================
      # PYTHON
      # =========================================

      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.10"


      # =========================================
      # JAVA
      # =========================================

      - name: Setup Java 17
        uses: actions/setup-java@v4

        with:
          distribution: temurin
          java-version: "17"


      # =========================================
      # LINUX DEPENDENCIES
      # =========================================

      - name: Install dependencies
        run: |

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            build-essential \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            gettext \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev


      # =========================================
      # PYTHON BUILD TOOLS
      # =========================================

      - name: Install Buildozer
        run: |

          python -m pip install --upgrade pip

          python -m pip install \
            setuptools \
            wheel

          python -m pip install \
            buildozer==1.5.0

          python -m pip install \
            cython==0.29.37


      # =========================================
      # VERIFY PROJECT
      # =========================================

      - name: Verify project
        run: |

          echo "===================================="
          echo "PROJECT"
          echo "===================================="

          pwd

          echo ""
          echo "FILES"

          find . \
            -maxdepth 2 \
            -type f \
            -not -path "./.git/*" \
            | sort

          echo ""
          echo "CHECK MAIN"

          test -f main.py

          echo "main.py OK"


          echo ""
          echo "CHECK BUILDOZER"

          test -f buildozer.spec

          echo "buildozer.spec OK"


          echo ""
          echo "CHECK ICON"

          test -f assets/icon.png

          echo "icon OK"


          echo ""
          echo "CHECK PRE-SPLASH"

          test -f assets/presplash.png

          echo "presplash OK"


      # =========================================
      # PYTHON SYNTAX
      # =========================================

      - name: Python syntax check
        run: |

          python -m py_compile main.py

          if [ -f database.py ]; then
            python -m py_compile database.py
          fi

          echo "Python syntax check passed."


      # =========================================
      # BUILDOZER
      # =========================================

      - name: Check Buildozer
        run: |

          buildozer --version


      # =========================================
      # CLEAN BUILD
      # =========================================

      - name: Clean build
        run: |

          rm -rf .buildozer
          rm -rf bin

          mkdir -p bin


      # =========================================
      # BUILD APK
      # =========================================

      - name: Build Android APK
        env:

          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          PYTHONUNBUFFERED: "1"

        run: |

          export PATH="$HOME/.local/bin:$PATH"

          buildozer -v android debug


      # =========================================
      # VERIFY APK
      # =========================================

      - name: Verify APK
        run: |

          echo "===================================="
          echo "APK RESULT"
          echo "===================================="

          ls -lah bin/

          APK=$(find bin \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then

            echo "APK NOT FOUND"

            exit 1

          fi

          echo "APK FOUND:"
          echo "$APK"


      # =========================================
      # UPLOAD APK
      # =========================================

      - name: Upload APK
        uses: actions/upload-artifact@v4

        with:

          name: KasirQU-v1.6-debug

          path: bin/*.apk

          if-no-files-found: error

          retention-days: 14


      # =========================================
      # BUILD LOG
      # =========================================

      - name: Upload build logs
        if: failure()

        uses: actions/upload-artifact@v4

        with:

          name: KasirQU-build-logs

          path: |
            .buildozer/
            buildozer.spec

          if-no-files-found: ignore

          retention-days: 7
