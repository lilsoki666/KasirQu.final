name: Build KasirQU APK

on:
workflow_dispatch:

jobs:
build:
name: Build Android APK
runs-on: ubuntu-22.04

steps: - name: Checkout repository uses: actions/checkout@v4 - name: Setup Python uses: actions/setup-python@v5 with: python-version: "3.11" - name: Setup Java uses: actions/setup-java@v4 with: distribution: temurin java-version: "17" - name: Install system dependencies run: | sudo apt-get update sudo apt-get install -y \ git \ zip \ unzip \ autoconf \ automake \ libtool \ pkg-config \ zlib1g-dev \ libncurses5-dev \ libncursesw5-dev \ cmake \ libffi-dev \ libssl-dev - name: Install Buildozer run: | python -m pip install --upgrade pip python -m pip install buildozer==1.5.0 python -m pip install cython==0.29.36 - name: Check project run: | echo "======================================" echo "PROJECT" echo "======================================" pwd ls -la echo "" echo "Checking required files..." test -f main.py test -f buildozer.spec test -f requirements.txt echo "Required files OK" - name: Check Python syntax run: | python -m py_compile main.py echo "main.py syntax OK" - name: Clean previous build run: | rm -rf .buildozer rm -rf bin - name: Build APK env: BUILDOZER_WARN_ON_ROOT: "0" run: | buildozer -v android debug - name: Check APK run: | echo "======================================" echo "APK FILES" echo "======================================" find . -type f -name "*.apk" -print test -n "$(find . -type f -name '*.apk' -print -quit)" echo "APK BUILD SUCCESS" - name: Upload APK uses: actions/upload-artifact@v4 with: name: KasirQU-APK path: bin/*.apk if-no-files-found: error 
